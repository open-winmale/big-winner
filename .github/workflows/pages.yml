# GitHub Pages：只读在线演示（真实数据快照的预烘结果，操作引导本地运行）
# 前置一次性设置：仓库 Settings → Pages → Source 选「GitHub Actions」
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/bake_pages_demo.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 构建只读演示版
        working-directory: web
        run: |
          npm ci
          npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
